<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Posts</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        #postsContainer {
            max-width: 800px;
            margin: auto;
        }

        .post {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }

        .post h2 {
            margin-top: 0;
        }

        .post h3 {
            margin-bottom: 10px;
        }

        .post p {
            line-height: 1.6;
        }

        .author {
            color: #666;
            font-size: 14px;
        }

        .content {
            margin-top: 15px;
            line-height: 1.6;
        }

        .post button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        .comment-section {
            margin-top: 25px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .comment-input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .comment-button {
            padding: 10px 15px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        .comment {
            background-color: #f5f5f5;
            padding: 10px;
            margin-top: 10px;
        }

        .comment-author {
            font-weight: bold;
        }

    </style>

</head>

<body>

    <h1>All Blog Posts</h1>

    <a href="index.html">Back to Home</a>

    <div id="postsContainer">
        <p>Loading posts...</p>
    </div>


    <script>

        async function loadPosts() {

            try {

                const response = await fetch(
                    "http://localhost:5000/api/posts"
                );

                const posts = await response.json();

                const container =
                    document.getElementById("postsContainer");

                const currentUser =
                    JSON.parse(localStorage.getItem("user"));

                container.innerHTML = "";

                if (posts.length === 0) {

                    container.innerHTML =
                        "<p>No blog posts found.</p>";

                    return;
                }


                posts.forEach(post => {

                    const postElement =
                        document.createElement("div");

                    postElement.className = "post";

                    postElement.innerHTML = `

                        <h2>${post.title}</h2>

                        <p class="author">
                            By ${post.author.name}
                        </p>

                        <p class="content">
                            ${post.content}
                        </p>


                        ${currentUser && currentUser.id === post.author._id ? `

                            <div>

                                <button onclick="editPost('${post._id}')">
                                    Edit
                                </button>

                                <button onclick="deletePost('${post._id}')">
                                    Delete
                                </button>

                            </div>

                        ` : ""}


                        <div class="comment-section">

                            <h3>Comments</h3>

                            <div id="comments-${post._id}">
                                Loading comments...
                            </div>


                            <input
                                type="text"
                                class="comment-input"
                                id="comment-input-${post._id}"
                                placeholder="Write a comment"
                            >


                            <button
                                class="comment-button"
                                onclick="addComment('${post._id}')"
                            >
                                Post Comment
                            </button>

                        </div>

                    `;

                    container.appendChild(postElement);

                    loadComments(post._id);

                });


            } catch (error) {

                document.getElementById("postsContainer").innerHTML =
                    "<p>Unable to load blog posts.</p>";

            }

        }


        async function loadComments(postId) {

            try {

                const response = await fetch(
                    `http://localhost:5000/api/comments/${postId}`
                );

                const comments = await response.json();

                const container =
                    document.getElementById(`comments-${postId}`);
                const currentUser =
                    JSON.parse(localStorage.getItem("user"));

                container.innerHTML = "";


                if (comments.length === 0) {

                    container.innerHTML =
                        "<p>No comments yet.</p>";

                    return;
                }


                comments.forEach(comment => {

                    const commentElement =
                        document.createElement("div");

                    commentElement.className = "comment";

                    commentElement.innerHTML = `

                        <p class="comment-author">
                            ${comment.author.name}
                        </p>

                        <p>
                            ${comment.content}
                        </p>

                        ${currentUser && currentUser.id === comment.author._id ? `

                            <button
                                onclick="deleteComment(
                                    '${comment._id}',
                                    '${postId}'
                                )"
                            >
                                Delete Comment
                            </button>

                        ` : ""}

                    `;

                    container.appendChild(commentElement);

                });


            } catch (error) {

                document.getElementById(
                    `comments-${postId}`
                ).innerHTML =
                    "<p>Unable to load comments.</p>";

            }

        }


        async function addComment(postId) {

            const input =
                document.getElementById(
                    `comment-input-${postId}`
                );

            const content = input.value;

            const token =
                localStorage.getItem("token");


            if (!token) {

                alert("Please login first");

                return;
            }


            if (!content) {

                alert("Please enter a comment");

                return;
            }


            try {

                const response = await fetch(
                    `http://localhost:5000/api/comments/${postId}`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },

                        body: JSON.stringify({
                            content: content
                        })
                    }
                );


                const data = await response.json();


                if (response.ok) {

                    input.value = "";

                    loadComments(postId);

                } else {

                    alert(data.message);

                }


            } catch (error) {

                alert("Unable to connect to the server");

            }

        }


        function editPost(postId) {

            window.location.href =
                `edit-post.html?id=${postId}`;

        }


        async function deletePost(postId) {

            const token =
                localStorage.getItem("token");


            if (!token) {

                alert("Please login first");

                return;
            }


            const confirmDelete = confirm(
                "Are you sure you want to delete this post?"
            );


            if (!confirmDelete) {

                return;
            }


            try {

                const response = await fetch(
                    `http://localhost:5000/api/posts/${postId}`,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );


                const data = await response.json();

                alert(data.message);


                if (response.ok) {

                    loadPosts();

                }


            } catch (error) {

                alert("Unable to connect to the server");

            }

        }


        async function deleteComment(commentId, postId) {

            const token =
                localStorage.getItem("token");


            if (!token) {

                alert("Please login first");

                return;
            }


            const confirmDelete = confirm(
                "Are you sure you want to delete this comment?"
            );


            if (!confirmDelete) {

                return;
            }


            try {

                const response = await fetch(
                    `http://localhost:5000/api/comments/${commentId}`,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );


                const data = await response.json();

                alert(data.message);


                if (response.ok) {

                    loadComments(postId);

                }


            } catch (error) {

                alert("Unable to connect to the server");

            }

        }


        loadPosts();

    </script>

</body>

</html>
